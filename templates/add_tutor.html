<!-- templates/add_tutor.html -->
{% extends 'base.html' %}

{% block title %}Add Tutor{% endblock %}

{% block content %}
    <h1>Add New Tutor</h1>
    <form method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="surname">Surname:</label>
        <input type="text" id="surname" name="surname" required><br><br>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <h2>Assign Modules</h2>
        {% for module in modules %}
            <input type="checkbox" id="module_{{ module.module_id }}" name="module_ids" value="{{ module.module_id }}">
            <label for="module_{{ module.module_id }}">{{ module.module_name }} ({{ module.module_code }})</label><br>
        {% endfor %}

        <h2>Availability</h2>
        <div id="availability_section">
            <div>
                <label>Day:</label>
                <input type="text" name="day_of_week_0" required>
                <label>Start Time:</label>
                <input type="time" name="start_time_0" required>
                <label>End Time:</label>
                <input type="time" name="end_time_0" required>
                <label>Module:</label>
                <select name="module_id_0">
                    {% for module in modules %}
                        <option value="{{ module.module_id }}">{{ module.module_name }} ({{ module.module_code }})</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <button type="button" onclick="addAvailability()">Add Another Availability Slot</button>

        <input type="hidden" id="availability_count" name="availability_count" value="1">
        <input type="submit" value="Add Tutor">
    </form>
    <br>
    <a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>

    <script>
        let availabilityCount = 1;

        function addAvailability() {
            const section = document.getElementById('availability_section');
            const newDiv = document.createElement('div');
            newDiv.innerHTML = `
                <label>Day:</label>
                <input type="text" name="day_of_week_${availabilityCount}" required>
                <label>Start Time:</label>
                <input type="time" name="start_time_${availabilityCount}" required>
                <label>End Time:</label>
                <input type="time" name="end_time_${availabilityCount}" required>
                <label>Module:</label>
                <select name="module_id_${availabilityCount}">
                    {% for module in modules %}
                        <option value="{{ module.module_id }}">{{ module.module_name }} ({{ module.module_code }})</option>
                    {% endfor %}
                </select>
            `;
            section.appendChild(newDiv);
            availabilityCount++;
            document.getElementById('availability_count').value = availabilityCount;
        }
    </script>
{% endblock %}
